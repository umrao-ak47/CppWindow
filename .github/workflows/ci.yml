name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cmake_extra_args: -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            cmake_extra_args: -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF
          - name: macOS Clang
            os: macos-latest
            cc: clang
            cxx: clang++
            cmake_extra_args: ""
          - name: Windows MSVC
            os: windows-latest
            cmake_extra_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config xorg-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCPPWINDOW_BUILD_EXAMPLES=ON
          -DCPPWINDOW_BUILD_TESTS=ON
          -DCPPWINDOW_BUILD_DOCS=OFF
          ${{ matrix.cmake_extra_args }}

      - name: Configure
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DCPPWINDOW_BUILD_EXAMPLES=ON
          -DCPPWINDOW_BUILD_TESTS=ON
          -DCPPWINDOW_BUILD_DOCS=OFF
          ${{ matrix.cmake_extra_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Clang Sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            asan_options: detect_leaks=1:halt_on_error=1
            cmake_extra_args: -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF
          - name: macOS Clang Sanitizers
            os: macos-latest
            cc: clang
            cxx: clang++
            asan_options: detect_leaks=0:halt_on_error=1
            cmake_extra_args: ""

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: ${{ matrix.asan_options }}
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config xorg-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure sanitizer build
        run: >
          cmake -S . -B build-sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DCPPWINDOW_ENABLE_SANITIZERS=ON
          -DCPPWINDOW_BUILD_EXAMPLES=ON
          -DCPPWINDOW_BUILD_TESTS=ON
          -DCPPWINDOW_BUILD_DOCS=OFF
          ${{ matrix.cmake_extra_args }}

      - name: Build sanitizer configuration
        run: cmake --build build-sanitizers --config Debug --parallel

      - name: Test sanitizer configuration
        run: ctest --test-dir build-sanitizers --build-config Debug --output-on-failure --timeout 120

  package:
    name: Package Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config xorg-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure install build
        run: >
          cmake -S . -B build-install
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"
          -DCPPWINDOW_INSTALL=ON
          -DCPPWINDOW_BUILD_EXAMPLES=OFF
          -DCPPWINDOW_BUILD_TESTS=OFF
          -DCPPWINDOW_BUILD_DOCS=OFF
          -DGLFW_BUILD_X11=ON
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build install package
        run: cmake --build build-install --config Release --parallel

      - name: Install package
        run: cmake --install build-install --config Release

      - name: Configure package consumer
        run: >
          cmake -S tests/package_consumer -B build-package-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

      - name: Build package consumer
        run: cmake --build build-package-consumer --config Release --parallel

      - name: Test package consumer
        run: ctest --test-dir build-package-consumer --build-config Release --output-on-failure

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Configure docs
        run: >
          cmake -S . -B build-docs
          -DCPPWINDOW_BUILD_DOCS=ON
          -DCPPWINDOW_BUILD_EXAMPLES=OFF
          -DCPPWINDOW_BUILD_TESTS=OFF

      - name: Build docs
        run: cmake --build build-docs --target cppwindow_docs
