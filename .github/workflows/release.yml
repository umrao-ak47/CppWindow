name: Release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA to release
        required: true
        default: main
        type: string
      draft:
        description: Create the GitHub release as a draft
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.target_ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          if [[ -z "$version" ]]; then
            echo "::error::VERSION is empty"
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION must produce a tag like v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen ninja-build pkg-config xorg-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure release preset
        run: >
          cmake --preset multi
          -DGLFW_BUILD_X11=ON
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build release preset
        run: cmake --build --preset multi-release --parallel

      - name: Test release preset
        run: ctest --preset multi-release

      - name: Configure ImGui preset
        run: >
          cmake --preset imgui
          -DGLFW_BUILD_X11=ON
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build ImGui preset
        run: cmake --build --preset imgui --parallel

      - name: Test ImGui preset
        run: ctest --preset imgui

      - name: Configure ImGui target provider preset
        working-directory: tests/imgui_target_provider
        run: >
          cmake --preset target-provider
          -DGLFW_BUILD_X11=ON
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build ImGui target provider preset
        working-directory: tests/imgui_target_provider
        run: cmake --build --preset target-provider --parallel

      - name: Test ImGui target provider preset
        working-directory: tests/imgui_target_provider
        run: ctest --preset target-provider

      - name: Configure docs preset
        run: cmake --preset docs

      - name: Build docs preset
        run: cmake --build --preset docs --parallel

      - name: Configure install preset
        run: >
          cmake --preset install
          -DGLFW_BUILD_X11=ON
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build install preset
        run: cmake --build --preset install --parallel

      - name: Configure package consumer preset
        working-directory: tests/package_consumer
        run: cmake --preset installed

      - name: Build package consumer preset
        working-directory: tests/package_consumer
        run: cmake --build --preset installed --parallel

      - name: Test package consumer preset
        working-directory: tests/package_consumer
        run: ctest --preset installed

      - name: Configure ImGui install preset
        run: >
          cmake --preset install-imgui
          -DGLFW_BUILD_X11=ON
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build ImGui install preset
        run: cmake --build --preset install-imgui --parallel

      - name: Configure ImGui package consumer preset
        working-directory: tests/package_consumer
        run: cmake --preset installed-imgui

      - name: Build ImGui package consumer preset
        working-directory: tests/package_consumer
        run: cmake --build --preset installed-imgui --parallel

      - name: Test ImGui package consumer preset
        working-directory: tests/package_consumer
        run: ctest --preset installed-imgui

      - name: Create release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="CppWindow-${version}/" \
            -o "dist/CppWindow-${version}.tar.gz" \
            HEAD
          git archive \
            --format=zip \
            --prefix="CppWindow-${version}/" \
            -o "dist/CppWindow-${version}.zip" \
            HEAD
          tar -czf "dist/CppWindow-${version}-docs-html.tar.gz" -C build-presets/docs/docs/html .
          sha256sum dist/* > "dist/CppWindow-${version}-SHA256SUMS.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cppwindow-${{ steps.version.outputs.tag }}-release-artifacts
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          title="CppWindow ${tag}"
          target_sha="$(git rev-parse HEAD)"
          draft_args=()
          prerelease_args=()

          if [[ "${{ inputs.draft }}" == "true" ]]; then
            draft_args+=(--draft)
          fi
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists"
            exit 1
          fi

          gh release create "$tag" dist/* \
            --target "$target_sha" \
            --title "$title" \
            "${draft_args[@]}" \
            "${prerelease_args[@]}" \
            --generate-notes
