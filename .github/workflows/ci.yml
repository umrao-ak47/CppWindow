name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            configure_preset: ci-release
            build_preset: ci-release
            test_preset: ci-release
            cmake_extra_args: -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            configure_preset: ci-release
            build_preset: ci-release
            test_preset: ci-release
            cmake_extra_args: -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF
          - name: macOS Clang
            os: macos-latest
            cc: clang
            cxx: clang++
            configure_preset: ci-release
            build_preset: ci-release
            test_preset: ci-release
            cmake_extra_args: ""
          - name: Windows MSVC
            os: windows-latest
            configure_preset: ci-windows
            build_preset: ci-windows-release
            test_preset: ci-windows-release
            cmake_extra_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb xorg-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.configure_preset }} ${{ matrix.cmake_extra_args }}

      - name: Configure
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.configure_preset }} ${{ matrix.cmake_extra_args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --preset ${{ matrix.test_preset }}

      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --preset ${{ matrix.test_preset }}

  imgui:
    name: ImGui
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb xorg-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure ImGui preset
        run: cmake --preset ci-imgui -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF

      - name: Build ImGui preset
        run: cmake --build --preset ci-imgui --parallel

      - name: Test ImGui preset
        run: xvfb-run -a ctest --preset ci-imgui

      - name: Configure ImGui target provider preset
        working-directory: tests/imgui_target_provider
        run: cmake --preset target-provider -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF

      - name: Build ImGui target provider preset
        working-directory: tests/imgui_target_provider
        run: cmake --build --preset target-provider --parallel

      - name: Test ImGui target provider preset
        working-directory: tests/imgui_target_provider
        run: ctest --preset target-provider

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Clang Sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            asan_options: detect_leaks=1:halt_on_error=1
            cmake_extra_args: -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF
          - name: macOS Clang Sanitizers
            os: macos-latest
            cc: clang
            cxx: clang++
            asan_options: detect_leaks=0:halt_on_error=1
            cmake_extra_args: ""

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: ${{ matrix.asan_options }}
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config xvfb xorg-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure sanitizer build
        run: cmake --preset sanitizers ${{ matrix.cmake_extra_args }}

      - name: Build sanitizer configuration
        run: cmake --build --preset sanitizers --parallel

      - name: Test sanitizer configuration
        if: runner.os != 'Linux'
        run: ctest --preset sanitizers

      - name: Test sanitizer configuration
        if: runner.os == 'Linux'
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/sanitizers/linux-lsan.supp:print_suppressions=1
        run: xvfb-run -a ctest --preset sanitizers

  package:
    name: Package Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xorg-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure install build
        run: cmake --preset install -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF

      - name: Build install package
        run: cmake --build --preset install --parallel

      - name: Configure package consumer
        working-directory: tests/package_consumer
        run: cmake --preset installed

      - name: Build package consumer
        working-directory: tests/package_consumer
        run: cmake --build --preset installed --parallel

      - name: Test package consumer
        working-directory: tests/package_consumer
        run: ctest --preset installed

      - name: Configure subproject consumer
        working-directory: tests/subproject_consumer
        run: cmake --preset subproject -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF

      - name: Build subproject consumer
        working-directory: tests/subproject_consumer
        run: cmake --build --preset subproject --parallel

      - name: Test subproject consumer
        working-directory: tests/subproject_consumer
        run: ctest --preset subproject

      - name: Configure subproject consumer with provided GLFW
        working-directory: tests/subproject_consumer
        run: cmake --preset provided-glfw -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF

      - name: Build subproject consumer with provided GLFW
        working-directory: tests/subproject_consumer
        run: cmake --build --preset provided-glfw --parallel

      - name: Test subproject consumer with provided GLFW
        working-directory: tests/subproject_consumer
        run: ctest --preset provided-glfw

      - name: Configure ImGui install build
        run: cmake --preset install-imgui -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF

      - name: Build ImGui install package
        run: cmake --build --preset install-imgui --parallel

      - name: Configure ImGui package consumer
        working-directory: tests/package_consumer
        run: cmake --preset installed-imgui

      - name: Build ImGui package consumer
        working-directory: tests/package_consumer
        run: cmake --build --preset installed-imgui --parallel

      - name: Test ImGui package consumer
        working-directory: tests/package_consumer
        run: ctest --preset installed-imgui

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen ninja-build

      - name: Configure docs
        run: cmake --preset docs

      - name: Build docs
        run: cmake --build --preset docs
